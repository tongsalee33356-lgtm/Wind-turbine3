<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Windmill Interactive Simulation</title>
  
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* UI Overlay บนหน้าจอ */
    #ui-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: none; /* แสดงเฉพาะเมื่อพบ Hiro Marker */
      flex-direction: column;
      gap: 10px;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      padding: 16px 24px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      color: white;
      min-width: 280px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    button {
      background: #10b981; /* สีเขียว */
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      flex: 1;
    }

    button:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button.off {
      background: #ef4444; /* สีแดงเมื่อสั่งปิด */
    }

    button.off:hover {
      background: #dc2626;
    }

    button.secondary {
      background: #3b82f6; /* สีฟ้า */
    }

    button.secondary:hover {
      background: #2563eb;
    }

    .status-text {
      font-size: 13px;
      color: #a7f3d0;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- UI ควบคุมหน้าจอ -->
  <div id="ui-container">
    <div class="status-text" id="status-label">สถานะ: ปิดทำงาน | ความเร็ว: หยุดนิ่ง</div>
    <div class="btn-group">
      <button id="btn-toggle" class="off" onclick="toggleWindmill()">เปิดกังหัน</button>
      <button id="btn-speed" class="secondary" onclick="changeSpeed()">ปรับความเร็ว</button>
    </div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
    vr-mode-ui="enabled: false">

    <!-- ตรวจจับ Hiro Marker -->
    <a-marker preset="hiro" id="hiro-marker">
      
      <!-- ฐานหญ้ารองรับกังหัน (Ground Base) -->
      <a-cylinder position="0 0 0" radius="1.2" height="0.05" color="#15803d"></a-cylinder>

      <!-- โครงสร้างกังหันลม (Windmill Structure) -->
      <a-entity id="windmill" position="0 0 0">
        
        <!-- เสากังหันทรงกรวย (Tower Base) -->
        <a-cone position="0 0.8 0" radius-bottom="0.25" radius-top="0.12" height="1.6" color="#f8fafc" material="roughness: 0.3"></a-cone>
        
        <!-- ห้องเครื่องด้านบน (Nacelle / Motor Box) -->
        <a-box position="0 1.6 0.05" width="0.22" height="0.22" depth="0.4" color="#0284c7"></a-box>
        
        <!-- ดุมแกนหมุนกังหัน (Rotor Hub) -->
        <a-cone position="0 1.6 0.28" radius-bottom="0.08" radius-top="0.02" height="0.15" rotation="90 0 0" color="#e2e8f0"></a-cone>

        <!-- ชุดใบพัดกังหัน (Blades Group) -->
        <a-entity id="blades-group" position="0 1.6 0.3">
          
          <!-- ใบพัดที่ 1 (ชี้ขึ้น) -->
          <a-box position="0 0.45 0" width="0.06" height="0.8" depth="0.01" color="#f1f5f9"></a-box>
          
          <!-- ใบพัดที่ 2 (เอียงทำมุม 120 องศา) -->
          <a-entity rotation="0 0 120">
            <a-box position="0 0.45 0" width="0.06" height="0.8" depth="0.01" color="#f1f5f9"></a-box>
          </a-entity>

          <!-- ใบพัดที่ 3 (เอียงทำมุม 240 องศา) -->
          <a-entity rotation="0 0 240">
            <a-box position="0 0.45 0" width="0.06" height="0.8" depth="0.01" color="#f1f5f9"></a-box>
          </a-entity>

        </a-entity>

      </a-entity>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ตัวแปรสถานะ
    let isRunning = false;
    let currentSpeedIndex = 0;
    
    // กำหนดระดับความเร็ว (ระยะเวลาหมุนครบรอบเป็นมิลลิวินาที)
    const speedLevels = [
      { name: 'รอบช้า (Eco)', dur: 4000 },
      { name: 'รอบปานกลาง (Normal)', dur: 2000 },
      { name: 'รอบเร็ว (High)', dur: 800 }
    ];

    const bladesGroup = document.getElementById('blades-group');
    const uiContainer = document.getElementById('ui-container');
    const statusLabel = document.getElementById('status-label');
    const marker = document.getElementById('hiro-marker');
    const btnToggle = document.getElementById('btn-toggle');

    // ตรวจจับเมื่อพบ หรือ หลุดจาก Marker
    marker.addEventListener('markerFound', () => {
      uiContainer.style.display = 'flex';
    });

    marker.addEventListener('markerLost', () => {
      uiContainer.style.display = 'none';
    });

    // ฟังก์ชันเปิด / ปิด การหมุนของกังหัน
    function toggleWindmill() {
      isRunning = !isRunning;

      if (isRunning) {
        btnToggle.textContent = 'ปิดกังหัน';
        btnToggle.classList.remove('off');
        applyRotation();
      } else {
        btnToggle.textContent = 'เปิดกังหัน';
        btnToggle.classList.add('off');
        stopRotation();
      }

      updateStatus();
    }

    // ฟังก์ชันปรับความเร็วใบพัด
    function changeSpeed() {
      currentSpeedIndex = (currentSpeedIndex + 1) % speedLevels.length;
      
      // ถ้ากังหันทำงานอยู่ ให้ใช้อนิเมชันตามความเร็วใหม่ทันที
      if (isRunning) {
        applyRotation();
      }

      updateStatus();
    }

    // ฟังก์ชันสั่งหมุนใบพัด
    function applyRotation() {
      bladesGroup.removeAttribute('animation');
      
      const currentDur = speedLevels[currentSpeedIndex].dur;
      
      bladesGroup.setAttribute('animation', {
        property: 'rotation',
        to: '0 0 -360',
        from: '0 0 0',
        loop: true,
        dur: currentDur,
        easing: 'linear'
      });
    }

    // ฟังก์ชันสั่งหยุดหมุนใบพัด
    function stopRotation() {
      bladesGroup.removeAttribute('animation');
    }

    // อัปเดตข้อความบน UI Overlay
    function updateStatus() {
      const stateText = isRunning ? 'กำลังทำงาน' : 'ปิดทำงาน';
      const speedText = isRunning ? speedLevels[currentSpeedIndex].name : 'หยุดนิ่ง';
      statusLabel.textContent = `สถานะ: ${stateText} | ความเร็ว: ${speedText}`;
    }
  </script>
</body>
</html>
